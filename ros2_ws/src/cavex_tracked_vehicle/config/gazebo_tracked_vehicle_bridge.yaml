# Combined ros_gz_bridge parameter_bridge config for the tracked vehicle.
#
# Real, structural fix: this project's launch file originally ran TWO
# separate `parameter_bridge` processes (one for sensors via CLI args, one
# for track_cmd_vel via a separate config file). Each process bridges
# /clock independently once told to (each had its own explicit /clock
# entry) -- running two processes meant two independent /clock relays
# (confirmed via `ros2 topic info /clock -v` showing 2 distinct
# `ros_gz_bridge` publisher GIDs while both processes were running),
# producing real timing jitter ("Detected jump back in time. Clearing TF
# buffer" warnings, repeatedly) that broke icp_odometry's frame-to-frame
# registration entirely (ratio stuck at 0.000000 even with substantial
# real vehicle motion) and, in turn, kept RTAB-Map's WM stuck at 0
# forever, starving Nav2's costmap and blocking explore_lite. Fixed by
# merging both processes into this one file / one parameter_bridge
# process, with exactly one /clock entry -- confirmed live afterward:
# `ros2 topic info /clock -v` shows exactly 1 publisher.
# Found and fixed alongside this session's other changes: topic_name and
# ros_topic_name are mutually exclusive (bridge config parse error every
# launch, "Could not parse entry") -- ros_topic_name + gz_topic_name is the
# correct pair, already used by every other entry in this file.
- ros_topic_name: "/imu"
  gz_topic_name: "/world/cavex_world/model/cavex_tracked_blueboat/link/imu_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar/points"
  gz_topic_name: "/lidar/points/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Real, confirmed (Task 1, live `gz topic -l` + `gz topic -i` after switching
# camera_sensor to type="rgbd_camera"): rgbd_camera renames its gz topics
# relative to the old plain "camera" type -- color image moved from
# "/camera/color" to "/camera/color/image", and camera_info moved from
# "/camera/camera_info" (parent-of-topic convention for plain camera) to
# "/camera/color/camera_info" (nested under the sensor's own topic instead).
# Both had to be updated here or the pre-existing color bridge would have
# silently gone dead the moment the SDF sensor type changed.
- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/camera/color/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# New with rgbd_camera (Task 1): depth image, confirmed live at
# "/camera/color/depth_image" (gz.msgs.Image, not a separate depth-specific
# gz message type). Depth shares the color sensor's intrinsics/camera_info
# topic in this Gazebo version -- confirmed live there is no separate
# "/camera/color/depth_camera_info" or similar; the sole camera_info topic
# above (already bridged) serves both. No second camera_info entry needed
# (see brief Step 3's own note anticipating exactly this).
- ros_topic_name: "/camera/depth/image_raw"
  gz_topic_name: "/camera/color/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- topic_name: "/world/cavex_world/pose/info"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# track_cmd_vel's ROS2<->gz-transport leg (Task 6): carries
# track_cmd_vel_bridge.py's /track_cmd_vel (ROS2 Twist) onto the real
# gz-transport topic /model/cavex_tracked_blueboat/cmd_vel (gz.msgs.Twist)
# that TrackedVehicle actually subscribes to.
- ros_topic_name: "track_cmd_vel"
  gz_topic_name: "/model/cavex_tracked_blueboat/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Same bridging requirement as the detach topic below, for the carried
# x500's own DetachableJoint (model.sdf.tracked) -- placeholder release path
# for future flight-control integration, not wired to any automatic trigger yet.
- ros_topic_name: "cavex/x500_release/detach"
  gz_topic_name: "/cavex/x500_release/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  direction: ROS_TO_GZ

