# ros_gz_bridge parameter_bridge config for track_cmd_vel_bridge.py's output.
#
# TrackedVehicle's real command input is gz-transport, not ROS 2 (confirmed
# in Task 3/Task 5: /model/cavex_tracked_blueboat/cmd_vel, gz.msgs.Twist).
# track_cmd_vel_bridge.py can only publish ROS 2 topics, so this
# parameter_bridge config carries its output the rest of the way:
#   /ap/twist/filtered --(track_cmd_vel_bridge.py)--> /track_cmd_vel (ROS 2)
#     --(this bridge)--> /model/cavex_tracked_blueboat/cmd_vel (gz-transport)
#
# Load with:
#   ros2 run ros_gz_bridge parameter_bridge --ros-args \
#     -p config_file:=<path-to-this-file>
- ros_topic_name: "track_cmd_vel"
  gz_topic_name: "/model/cavex_tracked_blueboat/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
