# Nav2 params for the tracked BlueBoat-hull vehicle, costmap-only bringup
# (navigation_launch.py).
#
# Ported from the abandoned cavex-legged-walker-phase1 branch's
# walker_nav2_params.yaml (final, reviewed version -- includes that
# branch's own fix-round correction reverting collision_monitor's
# cmd_vel_in_topic to stock "cmd_vel_smoothed", see this repo's task-11
# report). Based on nav2_bringup's default params
# (/opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml), trimmed to
# what navigation_launch.py actually needs. amcl and map_server are
# deliberately NOT included: RTAB-Map (Task 10) already owns
# localization+mapping (map -> odom -> base_link TF, and the /map
# occupancy grid), so Nav2's own SLAM/AMCL stack would be redundant and
# would fight RTAB-Map for the map->odom transform.
#
# Costmap obstacle source is the RTAB-Map-published '/map' OccupancyGrid
# (nav_msgs/msg/OccupancyGrid), not a raw LaserScan/PointCloud2 -- same
# situation as the walker: this vehicle has no /scan, only the 3D lidar
# (Task 10). A static_layer subscribed to /map is the correct Nav2
# costmap plugin for an externally-owned occupancy grid (this is the same
# pattern nav2_bringup's own default params use for map_server's /map).
#
# robot_base_frame is base_link, not base_footprint: Task 10 confirmed
# live (tf2_tools view_frames) that this vehicle's real TF root is
# base_link -- its stub URDF has no base_footprint link/joint at all.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /cavex/slam/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Real request: "when blocked, backup and search another corridor"
    # during autonomous exploration. Overrides Nav2's stock default BT
    # (see this file's own header comment) with one real, measured
    # change: BackUp's distance sized for this vehicle's real ~1.19m
    # hull, not the TurtleBot-scale 0.30m Nav2 ships by default -- see
    # tracked_vehicle_nav_to_pose_bt.xml's own header comment for the
    # full reasoning, including why "search another corridor" needs no
    # new code (explore_lite's own blacklist-on-abort logic already
    # handles it). Same repo-absolute-path convention this project
    # already uses elsewhere for paths a plain YAML file can't resolve
    # dynamically (gazebo_tracked_vehicle.launch.py's own WORKTREE_ROOT
    # comment documents the same real constraint).
    default_nav_to_pose_bt_xml: /home/parvu/CaveX-Explorer-Pro/ros2_ws/install/cavex_tracked_vehicle/share/cavex_tracked_vehicle/config/tracked_vehicle_nav_to_pose_bt.xml

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # vx_min was -0.35 -- MPPI was structurally allowed to reverse as part of
      # normal FollowPath execution (nothing to do with dead-end handling),
      # confirmed live as the real provenance of an observed "long reverse"
      # pass: dead_end_backtrack_node's own reverse is bounded to a logged 1m
      # retreat, but once its process exited (mid-survey, killed during
      # cleanup) explore_lite's next goal let MPPI drive the vehicle including
      # its own independent reverse capability, unrelated to any dead-end
      # logic. Zeroed out -- this vehicle's only intentional reverse driving
      # anywhere is dead_end_backtrack_node's own bounded 1m retreat; Nav2's
      # own controller should never choose to reverse on its own.
      vx_max: 0.5
      vx_min: 0.0
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        # Raised 3.81 -> 7.0 -> 10.0 alongside local_costmap's own
        # inflation_radius/cost_scaling_factor increases above -- real
        # request: keep the vehicle centered in the corridor, strengthened
        # again after it still got physically wedged against a wall at 7.0.
        # Real root cause found for a later "strange preference to go to
        # walls" report: this stayed BELOW PathAlignCritic's 14.0 the whole
        # time, so path-following could -- and did -- outweigh centering.
        # global_costmap's own inflation is deliberately kept low (0.35,
        # see that block's comment -- raising it broke frontier detection),
        # which leaves most of a corridor's global-costmap cost at zero, so
        # the PLANNED path itself has no incentive to be centered and can
        # legally hug a wall. PathAlignCritic then rewarded following that
        # wall-hugging plan more than CostCritic rewarded centering away
        # from it. Fixed at the critic-weight level (see PathAlignCritic's
        # own reduced weight below) rather than touching global_costmap,
        # to avoid re-breaking frontier detection.
        cost_weight: 10.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Reduced 14.0 -> 8.0, below CostCritic's 10.0 -- was the real cause
        # of a "strange preference to go to walls": at 14.0 this outweighed
        # CostCritic, so the controller preferred hugging the global plan
        # (which itself has no centering incentive, see CostCritic's own
        # comment) over actually centering in the corridor. Still enabled
        # and still a real contributor (above every other critic except
        # CostCritic), so the vehicle doesn't ignore the plan outright --
        # just no longer lets path-hugging beat corridor-centering.
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      # Task 11 fix round 1: at bringup, icp_odometry hasn't published `odom`
      # yet (it only starts once the vehicle has moved and RTAB-Map has
      # processed a first registered scan), and nav2_costmap_2d's own default
      # initial_transform_timeout is too short to survive that real gap --
      # confirmed live: local_costmap failed to activate ("Failed to activate
      # local_costmap because transform from base_link to odom did not become
      # available before timeout"), and every downstream lifecycle node stayed
      # permanently "inactive" (Nav2's lifecycle_manager does not auto-retry
      # after a failed startup). Manually re-triggering bringup once odom
      # existed (`ros2 service call /lifecycle_manager_navigation/manage_nodes
      # nav2_msgs/srv/ManageLifecycleNodes "{command: 0}"`) succeeded
      # immediately, confirming this is purely a startup-timing race, not a
      # real config/TF-tree defect. Real, documented nav2_costmap_2d parameter
      # (see costmap_2d_ros.hpp's initial_transform_timeout_ member) -- 60s
      # comfortably covers spawn + first real drive command + RTAB-Map's
      # first processed frame under this environment's real_time_factor.
      initial_transform_timeout: 60.0
      rolling_window: true
      # Doubled 6 -> 12 alongside cave_world's own 2x mesh scale -- this is
      # a rolling window's real coverage radius around the vehicle, not a
      # vehicle-size parameter, so it needs to track the doubled cave
      # geometry the same way inflation_radius above did (corridor
      # features/junctions are now roughly twice as far apart).
      width: 12
      height: 12
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
        map_subscribe_transient_local: true
      # Real, live-diagnosed root cause of explore_lite's documented
      # "No frontiers found, stopping" bug (see explore_node's own comment
      # below) -- NOT the map/costmap sync-timing theory that comment
      # originally suspected. Directly inspected both RTAB-Map's raw /map
      # and this costmap's own output as real OccupancyGrid data during a
      # live run: raw /map had free=3841 cells (real, navigable, bordering
      # plenty of unknown space), but with inflation_radius=0.5 this
      # costmap only had free=919 left -- the inflation layer was
      # consuming ~76% of the real free space, and what little remained
      # no longer bordered any unknown cells at all (checked by direct
      # 4-neighbor adjacency over the whole grid: 0 free-adjacent-to-
      # unknown cells found), so frontier_search legitimately found
      # nothing to explore even though ~72% of the map was still unknown.
      # Reducing to 0.35 (just above robot_radius=0.3, not an arbitrary
      # smaller number) recovered free=1474 and 1445 real frontier-
      # adjacent cells -- confirmed live via /explore/frontiers actually
      # publishing 2 real markers where it previously found none, same
      # map, same run, only this parameter changed.
      # Real request: "keep the vehicle in the middle of the corridor always."
      # inflation_radius=0.35 (matching global_costmap below) leaves ZERO
      # inflation cost -- and so zero centering pull from MPPI's CostCritic --
      # anywhere more than 0.35m from a wall, which is most of a typical
      # corridor here. This costmap is LOCAL (used by the controller/
      # CostCritic for real-time driving), not what explore_lite's frontier
      # search reads (that's global_costmap below, deliberately left
      # unchanged at 0.35 -- see that block's own comment for why raising it
      # broke frontier detection).
      # Raised further, 0.6 -> 0.9, after the vehicle still got physically
      # wedged against a wall with 0.6/cost_scaling_factor=3.0 -- that
      # combination only put real cost within roughly half a typical
      # corridor width, and cost_scaling_factor=3.0's exponential decay
      # concentrates nearly all of it within the first ~0.3m of the wall,
      # leaving most of the corridor still a flat near-zero-cost region.
      # cost_scaling_factor lowered 3.0 -> 1.5 as the real fix for that --
      # this is the exponential decay rate (cost = 253 * exp(-factor *
      # (distance - robot_radius))), so a lower value spreads meaningful
      # cost much further from the wall instead of collapsing it into a
      # thin band right at the surface, giving CostCritic a real gradient
      # to climb across most of the corridor width, not just the last few
      # centimeters before contact.
      # Raised again, 0.9 -> 1.8, after the cave_world mesh itself was
      # scaled 2x (see models/cave_world/model.sdf) -- real corridors here
      # are now roughly twice as wide as when 0.9 was derived, so 0.9m of
      # inflation from each wall no longer reached the new corridor's
      # middle at all: a flat, zero-cost band sat there with nothing for
      # CostCritic to act on regardless of its weight, the real cause of a
      # "still hugging walls" report even after fixing the CostCritic vs
      # PathAlignCritic weight ordering. Doubled to track the doubled
      # geometry, same reasoning as that earlier fix, not a new one.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5
        inflation_radius: 1.8
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Same real startup-timing race as local_costmap above, same fix.
      initial_transform_timeout: 60.0
      resolution: 0.05
      robot_radius: 0.3
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
        map_subscribe_transient_local: true
      # Real, live-diagnosed root cause of explore_lite's documented
      # "No frontiers found, stopping" bug (see explore_node's own comment
      # below) -- NOT the map/costmap sync-timing theory that comment
      # originally suspected. Directly inspected both RTAB-Map's raw /map
      # and this costmap's own output as real OccupancyGrid data during a
      # live run: raw /map had free=3841 cells (real, navigable, bordering
      # plenty of unknown space), but with inflation_radius=0.5 this
      # costmap only had free=919 left -- the inflation layer was
      # consuming ~76% of the real free space, and what little remained
      # no longer bordered any unknown cells at all (checked by direct
      # 4-neighbor adjacency over the whole grid: 0 free-adjacent-to-
      # unknown cells found), so frontier_search legitimately found
      # nothing to explore even though ~72% of the map was still unknown.
      # Reducing to 0.35 (just above robot_radius=0.3, not an arbitrary
      # smaller number) recovered free=1474 and 1445 real frontier-
      # adjacent cells -- confirmed live via /explore/frontiers actually
      # publishing 2 real markers where it previously found none, same
      # map, same run, only this parameter changed.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

collision_monitor:
  ros__parameters:
    use_sim_time: true
    # navigation_launch.py's lifecycle_manager_navigation hard-codes
    # collision_monitor as one of its managed nodes, and aborts the ENTIRE
    # bringup if any managed node fails to configure (confirmed on the
    # reference branch: with no collision_monitor section at all, it
    # errored "parameter 'observation_sources' is not initialized" and
    # every other server -- controller_server, planner_server,
    # bt_navigator, etc. -- never got past 'unconfigured'; leaving
    # polygons/observation_sources empty instead made the node abort with
    # SIGABRT on startup). So this section is nav2_bringup's own default
    # collision_monitor block, including cmd_vel_in_topic (kept as
    # stock's "cmd_vel_smoothed" -- the reference branch's own review
    # caught and reverted an earlier version that pointed this at
    # "cmd_vel_nav", silently bypassing navigation_launch.py's
    # velocity_smoother node). Its "scan" observation source is a
    # LaserScan on topic "scan", which this 3D-lidar-only robot never
    # publishes -- same limitation as the costmaps' missing
    # LaserScan-based obstacle_layer, see the top-of-file comment. With no
    # /scan publisher the source just never receives data, exactly like
    # icp_odometry's harmless "did not receive data on /scan" warning
    # elsewhere in this stack -- it does not crash or block bringup.
    # Fixed in final review: was "base_footprint", contradicting this file's
    # own header comment (line 23-25: robot_base_frame is base_link, this
    # vehicle's stub URDF has no base_footprint link/joint at all).
    #
    # Real fix (obstacle-avoidance request): the "scan" observation source
    # above was collision_monitor's ONLY source, and this vehicle has no 2D
    # LaserScan publisher at all (3D lidar only, see top-of-file comment) --
    # so collision_monitor was structurally wired up but never actually
    # detecting anything; it was a no-op the whole time, not a working
    # detect-and-avoid mechanism. Switched to a "pointcloud" source reading
    # this vehicle's real /lidar/points (same topic icp_odometry/rtabmap
    # already consume). Height window (0.0-1.2m in base_link frame) picks up
    # the lidar's own narrow +-15deg vertical FOV around its 0.55m mount
    # height at typical bubble-range distances while excluding ground-plane
    # hits, so it does not false-stop on the floor.
    #
    # Added ObstacleBubble: a "circle" polygon (static radius, unlike the
    # footprint-shaped polygons above) giving the vehicle a real, fixed
    # detect-and-avoid bubble -- the mechanism this project didn't have
    # before. Reduced 2.3->0.8: radius=0.8 = 0.5m of clearance beyond the
    # 0.3m robot_radius footprint edge (was 2.0m clearance, found too eager
    # in cave-corridor-width testing). action_type "slowdown" (not "stop")
    # so it eases the vehicle down rather than halting it dead the moment a
    # wall enters range; the tighter PolygonStop-equivalent behavior for
    # imminent contact is still covered by FootprintApproach below.
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["ObstacleBubble", "FootprintApproach"]
    ObstacleBubble:
      type: "circle"
      radius: 0.8
      action_type: "slowdown"
      slowdown_ratio: 0.5
      min_points: 4
      visualize: True
      polygon_pub_topic: "polygon_obstacle_bubble"
      enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    # Switched 3D -> 2D lidar (real request, see
    # docs/superpowers/specs/2026-08-11-2d-lidar-switch-design.md): keeping
    # this "pointcloud" source, NOT reverting to the historically-broken
    # "scan"/LaserScan source documented above (this vehicle never
    # published /scan and that config was a total no-op the whole time it
    # existed). min_height/max_height narrowed from 0.0-1.2m (sized for the
    # old +-15deg cone's vertical spread at typical bubble-range distances)
    # to a tight band around the lidar's real mount height -- lidar_link's
    # pose relative to base_link is z=0.55m (model.sdf.tracked, confirmed
    # directly, not assumed) -- +-0.10m margin for real pitch/roll/physics
    # jitter around the single flat ring.
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/lidar/points"
      min_height: 0.45
      max_height: 0.65
      use_global_height: False
      enabled: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# docking_server is another node navigation_launch.py's lifecycle_manager
# hard-codes as managed (same story as collision_monitor above): with no
# dock_plugins configured it errored "Charging dock plugins not given!"
# and aborted the whole Nav2 bringup. This robot has no docking station or
# charging dock, so docking is unused -- functionally this is stock
# nav2_bringup's default docking_server params (values match; the
# controller: sub-block and some comments present in stock are omitted
# here since this node stays inert), kept only so the lifecycle manager
# has something valid to configure.
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
