<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8' />
    <title>WebSocket Test</title>
  <script src='protobuf.min.js'></script>
  <script src='eventemitter2.min.js'></script>
  <script src='gz.js'></script>
  <script src='gz3d.js'></script>

  <script>
    // Create the Connection to the Gazebo websocket server
    // This configuration uses SSL and authentication. You can disable both
    // by replacing `wss://` with `ws://` and remove the `key` parameter.
    // Make sure to also disable SSL and authentication in the
    // websocket_server plugin.
    //
    // Real request 2026-08-26: view from a phone on the LAN. Was hardcoded to
    // 'localhost', which only ever means "this same device" -- a phone loading
    // this page from the Windows host's real LAN IP still needs to reach the
    // websocket server at THAT same IP, not its own localhost. Uses
    // location.hostname so it adapts to whatever host the page itself was
    // loaded from (localhost, 192.168.x.x, etc.) instead of hardcoding one.
    var gz = new Gazebo({
      url: 'ws://' + location.hostname + ':9002',
      key: "cavex_dev"
    });

    // Listen for the 'connection' event.
    gz.on('connection', function() {
      var output = document.getElementById('status');
      output.innerHTML = 'Status: connected';
    });

    // Real bug found live: this file shipped hardcoded to gz-launch's own demo world
    // ("shapes") both here and in the /world/.../dynamic_pose/info subscription below --
    // against our real world (cavex_world) that meant "scene" requested a world that
    // doesn't exist, so the client fell back to an empty default grid with nothing in
    // it. Both hardcoded to the real world name now.
    gz.on('worlds', function(_worlds) {
      // \todo Switch this to a service call when this issue is
      // resolved:
      // https://github.com/gazebosim/gz-transport/issues/135
      gz.once('scene', function(_sceneInfo) {
        // console.log(_sceneInfo);
        for (var i = 0; i < _sceneInfo.model.length; ++i) {
          var modelObj = createModelFromMsg(_sceneInfo.model[i]);
          scene.add(modelObj);
        }
      });
      gz.socket.send(buildMsg(['scene','cavex_world','','']));
    });

    // Create the clock subscriber
    var clockSub = new Topic({
      gz: gz,
      name: '/clock',
      messageType : 'gz.msgs.Clock',
      callback: function(msg) {
        var output = document.getElementById('output');
        output.innerHTML = 'Clock: ' + msg.sim.sec + '.' + msg.sim.nsec;
      }
    });

    // Real request 2026-08-26: "camera looking at the boat" -- a fixed
    // resetCameraPose() snapshot only helps at load time, and the boat moves
    // (it's been driven all over the map this session). Track it live instead:
    // BOAT_NAME's real pose already comes through on every dynamic_pose/info
    // update below (same message that moves the 3D model itself), so the
    // camera is repositioned at a fixed offset behind/above the boat and
    // pointed at it on every one of those updates, not just once.
    var BOAT_NAME = 'cavex_tracked_blueboat';
    var CAMERA_OFFSET = new THREE.Vector3(-8, -8, 6);

    // Create the pos subscriber
    var poseSub = new Topic({
      gz: gz,
      name: '/world/cavex_world/dynamic_pose/info',
      messageType : 'gz.msgs.Pose_V',
      callback: function(msg) {
        for (var i = 0; i < msg.pose.length; ++i) {
          var entity = scene.getByName(msg.pose[i].name);
          if (entity && entity !== scene.modelManipulator.object
              && entity.parent !== scene.modelManipulator.object) {
            scene.updatePose(entity, msg.pose[i].position,
              msg.pose[i].orientation);
          }
          if (msg.pose[i].name === BOAT_NAME) {
            var p = msg.pose[i].position;
            var boatPos = new THREE.Vector3(p.x, p.y, p.z);
            scene.camera.position.copy(boatPos).add(CAMERA_OFFSET);
            scene.camera.lookAt(boatPos);
          }
        }
      }
    });



    var camera, renderer;

    // Initialize GZ3D objects.
    const shaders = new GZ3D.Shaders();
    var scene = new GZ3D.Scene(shaders);
    var sdfParser = new GZ3D.SdfParser(scene);
    const ogre2json = new GZ3D.Ogre2Json();

    entityMaterial = {};
    protocol = "http:";
    // Real bug found live: this was 'localhost' with no port -- parseMaterial()
    // below builds its own asset URL from this (not the relative 'assets' path
    // GZ3D.Scene's MATERIAL_ROOT uses), so every material/texture fetch went to
    // localhost:80 instead of this page's real origin, silently failing (which
    // reads as "no color" -- geometry can still load via the relative path, but
    // material lookups can't). location.host already carries the real
    // hostname:port this page was served from.
    url = location.host;

    function init() {
      scene.grid.visible = true;
      // The domElement the renderer will be appended to.
      var sceneElement = window.document.getElementById('container');
      if (sceneElement === undefined || sceneElement === null) {
        console.log("Invalid scene element");
      }

      sceneElement.appendChild(scene.renderer.domElement);
      scene.setSize(sceneElement.clientWidth, sceneElement.clientHeight);

      /*
      // Hide sun visual
      const sunHelper = scene.scene.getObjectByName('sun_lightHelper');
      if (sunHelper) {
        sunHelper.visible = false;
      }

      // Delete ground plane
      const ground = scene.scene.getObjectByName('ground_plane');
      if (ground) {
        scene.remove(ground);
      }
      */

      resetCameraPose();

      // And sun orientation
      /*const sunLight = scene.scene.getObjectByName('sun').children[0];
      const sunDir = new THREE.Vector3(-0.4, 0.4, -0.4);
      console.log("2");

      sunLight.direction = new THREE.Vector3();
      sunLight.direction.copy(sunDir);
      sunLight.target.position.copy(sunDir);
      */

      // Start rendering.
      animate();

      /*
      var obj = scene.createSphere(1.0);
      obj.updateMatrix();
      scene.add(obj);
      */
    }

    function resetCameraPose() {
      // Real bug found live: this was near the world origin (x=1.1,y=-1.4,z=0.6),
      // sized for gz-launch's own tiny demo "shapes" world -- our real cave/water
      // world puts everything far from the origin, so on load this pointed at
      // empty space. Points at the water region (where the boat's real spawn and
      // most driving happens, around x=20) as a reasonable starting view; the
      // live camera-follow in the dynamic_pose/info callback below takes over
      // and tracks the boat's actual position within the first update anyway.
      const cam = scene.camera;
      cam.position.set(12, -8, 14);
      cam.lookAt(20, 0, 7.9);
    }

    function animate() {
      requestAnimationFrame(animate);
      scene.render();
    }

    function createModelFromMsg(model)
    {
      var modelObj = new THREE.Object3D();
      modelObj.name = model.name;
      modelObj.userData.id = model.id;
      if (model.pose) {
        scene.setPose(modelObj,
          model.pose.position, model.pose.orientation);
      }
      for (var j = 0; j < model.link.length; ++j)
      {
        var link = model.link[j];
        var linkObj = new THREE.Object3D();
        linkObj.name = link.name;
        linkObj.userData.id = link.id;
        linkObj.serverProperties =
            {
              self_collide: link.self_collide,
              gravity: link.gravity,
              kinematic: link.kinematic
            };

        if (link.inertial)
        {
          var inertialPose, inertialMass, inertia = {};
          linkObj.userData.inertial = {};
          inertialPose = link.inertial.pose;
          inertialMass = link.inertial.mass;
          inertia.ixx = link.inertial.ixx;
          inertia.ixy = link.inertial.ixy;
          inertia.ixz = link.inertial.ixz;
          inertia.iyy = link.inertial.iyy;
          inertia.iyz = link.inertial.iyz;
          inertia.izz = link.inertial.izz;
          linkObj.userData.inertial.inertia = inertia;
          if (inertialMass) {
            linkObj.userData.inertial.mass = inertialMass;
          }
          if (inertialPose) {
            linkObj.userData.inertial.pose = inertialPose;
          }
        }

        if (link.pose) {
          scene.setPose(linkObj, link.pose.position,
              link.pose.orientation);
        }
        modelObj.add(linkObj);
        for (var k = 0; k < link.visual.length; ++k)
        {
          var visual = link.visual[k];
          var visualObj = createVisualFromMsg(visual);
          if (visualObj && !visualObj.parent) {
            linkObj.add(visualObj);
          }
        }

        for (var l = 0; l < link.collision.length; ++l) {
          var collision = link.collision[l];
          for (var m = 0; m < link.collision[l].visual.length; ++m) {
            var collisionVisual = link.collision[l].visual[m];
            var collisionVisualObj = createVisualFromMsg(collisionVisual);
            if (collisionVisualObj && !collisionVisualObj.parent) {
              linkObj.add(collisionVisualObj);
            }
          }
        }
      }

      if (model.joint) {
        modelObj.joint = model.joint;
      }

      return modelObj;
    }

    function createVisualFromMsg(visual)
    {
      if (visual.geometry)
      {
        var geom = visual.geometry;
        var visualObj = new THREE.Object3D();
        visualObj.name = visual.name;
        if (visual.pose)
        {
          scene.setPose(visualObj, visual.pose.position,
              visual.pose.orientation);
        }

        visualObj.castShadow = visual.cast_shadows;
        visualObj.receiveShadow = visual.receive_shadows;

        createGeom(geom, visual.material, visualObj);

        return visualObj;
      }
    }

    function parseMaterial(material)
    {
      if (!material) {
        return null;
      }

      var uriPath = protocol + '//' + url + '/assets';
      var texture;
      var normalMap;
      var textureUri;
      var ambient;
      var diffuse;
      var specular;
      var opacity;
      var scale;
      var mat;

      // get texture from material script
      var script  = material.script;
      if (script) {
        if (script.name) {
          mat = material[script.name];
          if (mat) {
            ambient = mat['ambient'];
            diffuse = mat['diffuse'];
            specular = mat['specular'];
            opacity = mat['opacity'];
            scale = mat['scale'];

            var textureName = mat['texture'];
            if (textureName) {
              for (var i = 0; i < script.uri.length; ++i) {
                // handle the weird case where empty scripts become converted to
                // a single '__default__' script
                var scriptUri = script.uri[i];
                if (scriptUri === '__default__')
                {
                  scriptUri = 'file://media/materials/scripts/gazebo.material';
                }

                var type = scriptUri.substring(0,
                      scriptUri.indexOf('://'));

                if (type === 'model')
                {
                  if (scriptUri.indexOf('textures') > 0)
                  {
                    textureUri = scriptUri.substring(
                        scriptUri.indexOf('://') + 3);
                    break;
                  }
                }
                else if (type === 'file')
                {
                  if (scriptUri.indexOf('materials') > 0)
                  {
                    textureUri = scriptUri.substring(
                        scriptUri.indexOf('://') + 3,
                        scriptUri.indexOf('materials') + 9) + '/textures';
                    break;
                  }
                }
              }
              if (textureUri)
              {
                texture = uriPath + '/' +
                    textureUri  + '/' + textureName;
              }
            }
          }
        }
      }

      // Real bug found live: this whole function only ever read colors out of a
      // named material SCRIPT sub-object (material[script.name].ambient/diffuse/
      // specular) -- the old Gazebo-classic .material-script convention. None of
      // this project's own materials use scripts; they set ambient/diffuse/
      // specular directly on the Material message (gz.msgs.Color: r/g/b/a), which
      // this function never looked at, so every one of our own colors came back
      // undefined regardless of the asset-path/port fixes (those only fixed
      // texture/mesh fetches, not inline colors). Falls back to these direct
      // fields -- converted from {r,g,b,a} objects to the [r,g,b] arrays
      // GZ3D.Scene.setMaterial() expects -- only when a script didn't already
      // supply a color.
      function colorToArray(c) {
        return c ? [c.r, c.g, c.b] : undefined;
      }
      if (!ambient && material.ambient) {
        ambient = colorToArray(material.ambient);
      }
      if (!diffuse && material.diffuse) {
        diffuse = colorToArray(material.diffuse);
      }
      if (!specular && material.specular) {
        specular = colorToArray(material.specular);
      }
      // Real request: water_surface (cavex_world.world) sets its see-through
      // look via diffuse's own alpha (0.6), not a separate opacity/transparency
      // tag (the Material message here has no such field) -- carry that alpha
      // through as opacity so setMaterial() applies it.
      if (opacity === undefined && material.diffuse &&
          material.diffuse.a !== undefined && material.diffuse.a < 1) {
        opacity = material.diffuse.a;
      }

      // normal map
      if (material.normal_map) {
        var mapUri;
        if (material.normal_map.indexOf('://') > 0)
        {
          mapUri = material.normal_map.substring(
              material.normal_map.indexOf('://') + 3,
              material.normal_map.lastIndexOf('/'));
        }
        else
        {
          mapUri = textureUri;
        }
        if (mapUri)
        {
          var startIndex = material.normal_map.lastIndexOf('/') + 1;
          if (startIndex < 0)
          {
            startIndex = 0;
          }
          var normalMapName = material.normal_map.substr(startIndex,
              material.normal_map.lastIndexOf('.') - startIndex);
          normalMap = uriPath + '/' +
            mapUri  + '/' + normalMapName + '.png';
        }
      }

      return {
          texture: texture,
          normalMap: normalMap,
          ambient: ambient,
          diffuse: diffuse,
          specular: specular,
          opacity: opacity,
          scale: scale
      };
    }

    function createGeom (geom, material, parent)
    {
      var obj;
      var uriPath = 'assets';
      var that = this;
      var mat = parseMaterial(material);

      if (geom.box)
      {
        obj = scene.createBox(geom.box.size.x, geom.box.size.y,
            geom.box.size.z);
      }
      else if (geom.cylinder)
      {
        obj = scene.createCylinder(geom.cylinder.radius,
            geom.cylinder.length);
      }
      else if (geom.sphere)
      {
        obj = scene.createSphere(geom.sphere.radius);
      }
      else if (geom.plane)
      {
        obj = scene.createPlane(geom.plane.normal.x, geom.plane.normal.y,
            geom.plane.normal.z, geom.plane.size.x, geom.plane.size.y);
      }
      else if (geom.mesh)
      {
        // get model name which the mesh is in
        var rootModel = parent;
        while (rootModel.parent)
        {
          rootModel = rootModel.parent;
        }

        // find model from database, download the mesh if it exists
        // var manifestXML;
        // var manifestURI = GAZEBO_MODEL_DATABASE_URI + '/manifest.xml';
        // var request = new XMLHttpRequest();
        // request.open('GET', manifestURI, false);
        // request.onreadystatechange = function(){
        //   if (request.readyState === 4)
        //   {
        //     if (request.status === 200 || request.status === 0)
        //     {
        //         manifestXML = request.responseXML;
        //     }
        //   }
        // };
        // request.send();

        // var uriPath;
        // var modelAvailable = false;
        // var modelsElem = manifestXML.getElementsByTagName('models')[0];
        // var i;
        // for (i = 0; i < modelsElem.getElementsByTagName('uri').length; ++i)
        // {
        //   var uri = modelsElem.getElementsByTagName('uri')[i];
        //   var model = uri.substring(uri.indexOf('://') + 3);
        //   if (model === rootModel)
        //   {
        //     modelAvailable = true;
        //   }
        // }

        // if (modelAvailable)
        {
          var meshUri = geom.mesh.filename;
          var submesh = geom.mesh.submesh;
          var centerSubmesh = geom.mesh.center_submesh;

          var uriType = meshUri.substring(0, meshUri.indexOf('://'));
          var modelName = '';
          // file:// or model:// or models:// -- real bug found live: our own
          // vehicle model (blueboat/model.sdf.tracked) uses "models://" (plural),
          // which this check silently dropped, leaving modelName empty and the
          // mesh never loaded at all. That's most of "lots of elements lost".
          if (uriType === 'file' || uriType === 'model' || uriType === 'models')
          {
            modelName = meshUri.substring(meshUri.indexOf('://') + 3);
          }
          // absolute path - happens when an urdf model is spawned
          // into gazebo through gazebo_ros_pkgs
          else if (meshUri.length > 0 && meshUri[0] === '/')
          {
            // hacky but try to guess the model name from uri based on the
            // meshes directory string
            var idx = meshUri.indexOf('/meshes/');
            if (idx > 1)
            {
              modelName = meshUri.substring(meshUri.lastIndexOf('/', idx-1));
            }
          }
          if (modelName.length > 0)
          {
            if (geom.mesh.scale)
            {
              parent.scale.x = geom.mesh.scale.x;
              parent.scale.y = geom.mesh.scale.y;
              parent.scale.z = geom.mesh.scale.z;
            }

            var modelUri = uriPath + '/' + modelName;
            // Use coarse version on touch devices
            if (modelUri.indexOf('.dae') !== -1 && isTouchDevice)
            {
              modelUri = modelUri.substring(0,modelUri.indexOf('.dae'));

              var checkModel = new XMLHttpRequest();
              checkModel.open('HEAD', modelUri+'_coarse.dae', false);
              checkModel.send();
              if (checkModel.status === 404)
              {
                modelUri = modelUri+'.dae';
              }
              else
              {
                modelUri = modelUri+'_coarse.dae';
              }
            }

            var ext = modelUri.substr(-4).toLowerCase();
            var materialName = parent.name + '::' + modelUri;
            entityMaterial[materialName] = mat;

            modelUri = protocol + '//' + url + '/' + modelUri;

            scene.loadMeshFromUri(modelUri, submesh, centerSubmesh,
              function(mesh) {
                if (mat)
                {
                  // Because the stl mesh doesn't have any children we cannot set
                  // the materials like other mesh types.
                  if (modelUri.indexOf('.stl') === -1)
                  {
                    // Real bug found live: the original "break" here stopped after the
                    // FIRST Mesh child, so a .dae with multiple sub-meshes (our own
                    // hull.dae has several) only ever got the SDF material applied to
                    // one of them -- the rest kept the .dae's own embedded default,
                    // reading as grey/uncolored. Apply to every Mesh child instead.
                    var allChildren = [];
                    mesh.getDescendants(allChildren);
                    for (var c = 0; c < allChildren.length; ++c)
                    {
                      if (allChildren[c] instanceof THREE.Mesh)
                      {
                        that.scene.setMaterial(allChildren[c], mat);
                      }
                    }
                  }
                  else
                  {
                    that.scene.setMaterial(mesh, mat);
                  }
                }
                else
                {
                  if (ext === '.stl')
                  {
                    that.scene.setMaterial(mesh, {'ambient': [1,1,1,1]});
                  }
                }
                parent.add(mesh);
                loadGeom(parent);
            });
          }
        }
      }
      else if (geom.heightmap)
      {
        var request = new ROSLIB.ServiceRequest({
          name : that.scene.name
        });

        // redirect the texture paths to the assets dir
        var textures = geom.heightmap.texture;
        for ( var k = 0; k < textures.length; ++k)
        {
          textures[k].diffuse = parseUri(textures[k].diffuse);
          textures[k].normal = parseUri(textures[k].normal);
        }

        var sizes = geom.heightmap.size;

        // send service request and load heightmap on response
        heightmapDataService.callService(request,
            function(result)
            {
              var heightmap = result.heightmap;
              // gazebo heightmap is always square shaped,
              // and a dimension of: 2^N + 1
              that.scene.loadHeightmap(heightmap.heights, heightmap.size.x,
                  heightmap.size.y, heightmap.width, heightmap.height,
                  heightmap.origin, textures,
                  geom.heightmap.blend, parent);
                //console.log('Result for service call on ' + result);
            });

        //scene.loadHeightmap(parent)
      }

      if (obj)
      {
        if (mat)
        {
          // texture mapping for simple shapes and planes only,
          // not used by mesh and terrain
          scene.setMaterial(obj, mat);
        }
        obj.updateMatrix();
        parent.add(obj);
        loadGeom(parent);
      }

      function loadGeom(visualObj)
      {
        var allChildren = [];
        visualObj.getDescendants(allChildren);
        for (var c = 0; c < allChildren.length; ++c)
        {
          if (allChildren[c] instanceof THREE.Mesh)
          {
            allChildren[c].castShadow = true;
            allChildren[c].receiveShadow = true;

            if (visualObj.castShadows)
            {
              allChildren[c].castShadow = visualObj.castShadows;
            }
            if (visualObj.receiveShadows)
            {
              allChildren[c].receiveShadow = visualObj.receiveShadows;
            }

            if (visualObj.name.indexOf('COLLISION_VISUAL') >= 0)
            {
              allChildren[c].castShadow = false;
              allChildren[c].receiveShadow = false;

              allChildren[c].visible = scene.showCollisions;
            }
            break;
          }
        }
      }
    }

    function parseUri(uri) {
      var uriPath = 'assets';
      var idx = uri.indexOf('://');
      if (idx > 0)
      {
        idx +=3;
      }
      return uriPath + '/' + uri.substring(idx);
    }

    // Todo:
    // 2. Show simple shapes.
    // 3. Get the meshes and other resource from the server.
  </script>
  </head>

  <body onload="init()">
    <div id='status'>Status: disconnected</div>
    <div id='output'></div>

    <div id="container" style="height: 800px; position: relative;">
    </div>

    <!-- Real request 2026-08-26: functional control buttons in the browser
         viewer, later moved to top-left/top-middle/top-right by real request.
         control_server.py's /api/manual and /api/tracks relay these into the
         exact same gz-transport topics the desktop GUI's ManualControl/
         ActionButtons plugins already send (/cavex/manual_cmd,
         /cavex/track_cmd) -- manual_gui_bridge.py handles both already, no
         new backend logic needed. -->
    <div id="dpad" style="position: fixed; top: 10px; left: 10px;
        font-family: sans-serif; z-index: 10;
        display: grid; grid-template-columns: repeat(3, 48px);
        grid-template-rows: repeat(3, 40px); gap: 4px;">
      <!-- Real bug found live: onmousedown=direction + onmouseup=stop assumed a
           press-and-hold interaction, but a plain click always fires both events
           back-to-back, so every tap immediately sent 'stop' right after the
           direction -- manual_gui_bridge.py's own held-command semantics (a
           direction persists until 'stop' or a different direction arrives, see
           its docstring) already want a single tap to set the direction, not a
           press-and-hold gesture. onclick for every direction now, matching that
           model; only 'stop' itself needs its own tap. -->
      <button style="grid-column:2;grid-row:1" onclick="manualCmd('forward')">fwd</button>
      <button style="grid-column:1;grid-row:2" onclick="manualCmd('left')">left</button>
      <button style="grid-column:2;grid-row:2" onclick="manualCmd('stop')">stop</button>
      <button style="grid-column:3;grid-row:2" onclick="manualCmd('right')">right</button>
      <button style="grid-column:2;grid-row:3" onclick="manualCmd('backward')">rev</button>
    </div>

    <div id="trackControls" style="position: fixed; top: 10px; left: 50%;
        transform: translateX(-50%); font-family: sans-serif; z-index: 10;
        display: flex; gap: 4px;">
      <button onclick="trackCmd('deployed')">tracks down</button>
      <button onclick="trackCmd('retracted')">tracks up</button>
    </div>

    <div id="speedControls" style="position: fixed; top: 10px; right: 10px;
        font-family: sans-serif; z-index: 10;
        display: flex; flex-direction: column; gap: 4px;">
      <button onclick="manualCmd('speed_up')">spd +</button>
      <button onclick="manualCmd('speed_down')">spd -</button>
      <button id="manualToggle" onclick="toggleManual()">man: OFF</button>
    </div>

    <script>
      var manualOn = false;
      function manualCmd(cmd) {
        fetch('/api/manual?cmd=' + cmd);
      }
      function trackCmd(cmd) {
        fetch('/api/tracks?cmd=' + cmd);
      }
      function toggleManual() {
        manualOn = !manualOn;
        manualCmd(manualOn ? 'manual_on' : 'manual_off');
        document.getElementById('manualToggle').textContent =
          'man: ' + (manualOn ? 'ON' : 'OFF');
      }
    </script>
  </body>
</html>
